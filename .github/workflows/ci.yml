name: MLflow Project CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CSV_URL: "MLProject/diabetes_preprocessing/diabetes_preprocessing.csv"
  TARGET_VAR: "Outcome"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          echo "CSV_URL: $CSV_URL"
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0

      - name: Run mlflow project
        run: |
          cd MLProject
          mlflow run . --env-manager=local -P data_path=diabetes_preprocessing/diabetes_preprocessing.csv
        env:
          MLFLOW_TRACKING_URI: ""

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(ls -td MLProject/mlruns/0/*/ | head -n 1 | xargs -n 1 basename)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Install Python dependencies
        run: |
          pip install scikit-learn==1.5.2 pandas==2.2.3 numpy==2.1.3

      - name: Upload to GitHub (artefak model)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f MLProject/mlruns/
          git diff --cached --quiet || git commit -m "ci: save mlflow artifacts run $RUN_ID [skip ci]"
          git push

      - name: Upgrade MLflow for Docker build
        run: |
          pip install "mlflow==2.22.4"

      - name: Build Docker Model
        run: |
          mlflow models build-docker \
            --model-uri "runs:/$RUN_ID/model" \
            --name "smsml-diabetes"
        env:
          MLFLOW_TRACKING_URI: "file:${{ github.workspace }}/MLProject/mlruns"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag smsml-diabetes ${{ secrets.DOCKER_HUB_USERNAME }}/smsml-diabetes:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/smsml-diabetes:latest
